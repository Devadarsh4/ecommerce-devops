<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaCart X</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#eef3f9;color:#222}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 5%;background:#111827;color:#fff;position:sticky;top:0}
.logo{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:bold;color:#4ade80}
.logo img{width:42px}
nav a{text-decoration:none;color:#fff;margin:0 10px}
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:60px 5%;background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff}
.hero img{width:100%;max-width:500px}
.btn{background:#22c55e;color:#fff;padding:12px 24px;border-radius:30px;text-decoration:none}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:15px;padding:25px 5%}
.icon{background:#fff;padding:20px;border-radius:15px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.icon img{width:60px}
.products{padding:40px 5%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.1);text-align:center;transition:.3s}
.card:hover{transform:translateY(-8px)}
.card img{height:140px;object-fit:contain}
button{padding:10px 15px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
#login{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5)}
.modal{background:#fff;width:320px;margin:100px auto;padding:25px;border-radius:12px}
.modal input{width:100%;padding:10px;margin:10px 0}
footer{background:#111827;color:#ddd;text-align:center;padding:30px;margin-top:40px}
@media(max-width:800px){.hero{grid-template-columns:1fr;text-align:center}.icons{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<div class="logo"><img src="https://cdn-icons-png.flaticon.com/512/891/891462.png">NovaCart X</div>
<nav>
<a href="#"> Home</a>
<a href="#">🛍 Products</a>
<a href="#">🔥 Deals</a>
<a href="#" onclick="openLogin()">👤 Login</a>
<a href="#">🛒 Cart <span id="count">0</span></a>
</nav>
</header>

<section class="hero">
<div>
<h1>🚀 Future of Shopping</h1>
<p>Beautiful static e-commerce website for DevOps deployment.</p><br>
<a class="btn" href="#shop">Shop Now</a>
</div>
<img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
</section>

<div class="icons">
<div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/3144/3144456.png"><p>Fashion</p></div>
<div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/1042/1042390.png"><p>Camera</p></div>
<div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/2920/2920321.png"><p>Watch</p></div>
<div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/179/179386.png"><p>Laptop</p></div>
<div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/2589/2589903.png"><p>Shoes</p></div>
<div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/15/15874.png"><p>Phone</p></div>
</div>

<section class="products" id="shop">
<h2>🔥 Trending Products</h2><br>
<div class="grid" id="grid"></div>
</section>

<div id="login">
<div class="modal">
<h2>👤 Login</h2>
<input placeholder="Email">
<input type="password" placeholder="Password">
<button onclick="alert('Demo Login Successful');closeLogin()">Login</button>
<button onclick="closeLogin()">Close</button>
</div>
</div>

<footer>
<h2>🌟 NovaCart X</h2>
<p>💳 Secure Payment • 🚚 Fast Delivery • ❤️ Trusted by Customers</p>
</footer>

<script>
const data=[
["Laptop","https://cdn-icons-png.flaticon.com/512/179/179386.png",79999],
["Phone","https://cdn-icons-png.flaticon.com/512/15/15874.png",34999],
["Watch","https://cdn-icons-png.flaticon.com/512/2920/2920321.png",4999],
["Shoes","https://cdn-icons-png.flaticon.com/512/2589/2589903.png",2999],
["Headphones","https://cdn-icons-png.flaticon.com/512/27/27237.png",2499],
["Camera","https://cdn-icons-png.flaticon.com/512/1042/1042390.png",55999],
["Keyboard","https://cdn-icons-png.flaticon.com/512/2099/2099192.png",1499],
["Speaker","https://cdn-icons-png.flaticon.com/512/3659/3659899.png",5999]
];
let c=0;
data.forEach(x=>{
grid.innerHTML+=`<div class='card'><img src='${x[1]}'><h3>${x[0]}</h3><p>⭐⭐⭐⭐⭐</p><h2>₹${x[2]}</h2><button onclick='cart()'>🛒 Add to Cart</button></div>`;
});
function cart(){c++;count.innerText=c;}
function openLogin(){login.style.display='block';}
function closeLogin(){login.style.display='none';}
</script>
</body>
</html>
